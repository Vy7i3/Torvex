name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, Rust tests, audit tests, native harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential python3
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --all-targets
      - name: Run Python audit tests
        run: python3 -m unittest discover -s python -v
      - name: Build and run the native harness
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter \
            native/torvex_core.cpp native/test_native.cpp -o /tmp/torvex-native
          /tmp/torvex-native

  msrv:
    name: Minimum supported Rust (1.95.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check all targets with the declared MSRV
        run: cargo check --locked --all-targets

  gui:
    name: Optional desktop GUI build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: gui
      - name: Check the GUI feature
        run: cargo check --locked --features gui
