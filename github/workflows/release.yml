name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64 release archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --locked --release
      - name: Package archive
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="snapshot-${GITHUB_SHA::7}"
          fi
          archive="torvex-${version}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "dist/torvex/rules"
          cp target/release/torvex dist/torvex/
          cp rules/*.yar dist/torvex/rules/
          cp rules/README.md dist/torvex/rules/
          cp README.md CHANGELOG.md SECURITY.md LICENSE-MIT LICENSE-APACHE dist/torvex/
          tar -C dist -czf "dist/${archive}" torvex
          cd dist
          sha256sum "${archive}" > "${archive}.sha256"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: torvex-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          # Torvex is an alpha. Remove this when a stable release is published.
          prerelease: true
          fail_on_unmatched_files: true
