[package]
name = "torvex"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Experimental local-first file scanner with YARA-X rules and a desktop GUI"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["security", "scanner", "yara", "malware", "cli"]
categories = ["command-line-utilities", "security"]
default-run = "torvex"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hex = "0.4"
infer = "0.22"
mime_guess = "2"
# YARA-X 1.23's default crypto modules use this rsa feature but do not enable it.
rsa = { version = "0.10", features = ["pkcs1v15"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
yara-x = "1.23"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
