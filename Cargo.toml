[package]
name = "torvex"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A local-first experimental file scanner with a Rust GUI and YARA-X rules"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
mime_guess = "2"
yara-x = "1.23"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# YARA-X 1.23's default crypto modules use this rsa feature but do not enable it.
rsa = { version = "0.10", features = ["pkcs1v15"] }

[dev-dependencies]
tempfile = "3"
